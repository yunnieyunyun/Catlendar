<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cat</title>
    <link rel="stylesheet" href="style.css" />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js'></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
      var calendarEl = document.getElementById('calendar');
      var eventForm = document.getElementById('eventForm');
      var eDate = document.getElementById('eDate');
      var eStart = document.getElementById('eStart');
      var eEnd = document.getElementById('eEnd');
      var eName = document.getElementById('eName');
      var calendar = new FullCalendar.Calendar(calendarEl,
       {
        initialView: 'dayGridMonth',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay'
          },
        nowIndicator: true,
        selectable: true,
        //Eve Ang
        dateClick: function(info) {
          eDate.value = info.dateStr.substring(0,11);
          if (info.dateStr.length < 11){
            eStart.value = info.dateStr + "T06:00";
            eEnd.value = info.dateStr + "T07:00";
          }
          else {
            eStart.value = info.dateStr.substring(0,19);
            var eEndDate = new Date(info.dateStr);
            eEndDate.setHours(eEndDate.getHours() + 1);
            eEnd.value = info.dateStr.substring(0,11) + eEndDate.toString().substring(16,24);
          }

        },
        events: [

        ]
      });

      eventForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        if (eventForm.checkValidity()){
          calendar.addEvent({
            id: "user-" + Date.now(),
            title: eName.value,
            start: eStart.value,
            end: eEnd.value
          });
          eventForm.reset();
        }
      });

      calendar.render();

      async function loadCompletedTasks() {
        if (sessionStorage.getItem('loggedIn') !== 'true') return;

        var email = sessionStorage.getItem('email');
        if (!email) return;

        try {
          var response = await fetch('/completedTasks?email=' + encodeURIComponent(email));
          var data = await response.json();
          if (!response.ok || !data.success) return;

          data.completedTasks.forEach(function(task) {
            calendar.addEvent({
              id: "completed-" + task.id,
              title: "Completed: " + task.task,
              start: task.taskDate,
              allDay: true
            });
          });
        } catch (err) {
          console.error('Could not load completed tasks:', err);
        }
      }

      document.addEventListener('completed-task-saved', function(event) {
        var task = event.detail;
        if (!task) return;

        calendar.addEvent({
          id: "completed-" + task.id,
          title: "Completed: " + task.task,
          start: task.taskDate,
          allDay: true
        });
      });

      loadCompletedTasks();
    });
  </script>
  </head>
  <body>
    <div id="background-wrapper">
      <img src="assets/calenderBG.gif" class="welcome-gif" />
    </div>
    <div id="intro">
      <div id="intro-opening">
        <p>🐾</p>
      </div>
        <p id="catFact"></p>
    </div>
    <header>
      <p id="name">
        <img src="logo.jpg" alt="logo" id="logo" />

        <span style="font-weight: bold">Welcome: </span>Log in to displayname
      </p>
      <div id="button-container">
        <a href="information.html" id="infoBtn">Cat Info</a>
        <a href="account_page/account.html" id="accountBtn"
          >Login / Signup</a
        >
      </div>
    </header>
    <div id="ai-widget">
      <div
        id="ai-chat-backdrop"
        class="ai-chat-backdrop"
        aria-hidden="true"
      ></div>
      <div
        id="ai-chat-panel"
        class="ai-chat-panel"
        role="dialog"
        aria-label="Cat AI chat"
        aria-modal="true"
        aria-hidden="true"
      >
        <header class="ai-chat-header">
          <div class="ai-chat-header-text">
            <span class="ai-chat-title">Cat AI</span>
            <span class="ai-chat-subtitle"
              >Ask anything — replies in cat voice</span
            >
          </div>
          <button
            type="button"
            class="ai-chat-minimize"
            id="ai-chat-minimize"
            aria-label="Close chat"
          >
            ×
          </button>
        </header>
        <div class="ai-chat-messages" id="ai-chat-messages"></div>
        <form class="ai-chat-form" id="ai-chat-form">
          <input
            type="text"
            id="ai-chat-input"
            placeholder="Ask anything…"
            autocomplete="off"
            maxlength="2000"
          />
          <button type="submit" class="ai-chat-send">Send</button>
        </form>
      </div>
      <button
        type="button"
        id="ai-launcher"
        class="ai-launcher"
        aria-label="Open Cat AI chat"
        aria-expanded="false"
        aria-controls="ai-chat-panel"
      >
        <img src="piccatss/catAi.png" alt="" />
      </button>
    </div>
    <div id="welcome">
      <div class="title-box">
        <h1>Catlendar</h1>
        <p>A place to love your cat and be productive</p>
      </div>
    </div>
    <br />
    <table id="completeCalendar">
      <tr id="infoRow">
        <td class="calendarData">
          <form id="eventForm">
            <div class="eInput">
              <div id="eLabel"><label for="eName">Event Name</label></div>
              <input 
                type="text"
                id="eName"
                placeholder="Event Name"
                required
              />
            </div>
            <div class="eInput">
              <div class="eLabel"><label for="eDate">Date</label></div>
              <input 
                value=""
                type="text"
                id="eDate"
                placeholder="Enter a date (YYYY-MM-DD)"
                required
                />
            </div>
            <div class="eInput">
              <div class="eLabel"><label for="eStart">Event Start Time</label></div>
              <input 
                value=""
                type="datetime-local"
                id="eStart"
                placeholder="Enter a time (HH:MM)"
                required
                />
            </div>
            </div>
            <div class="eInput">
              <div class="eLabel"><label for="eEnd">Event End Time</label></div>
              <input 
                value=""
                type="datetime-local"
                id="eEnd"
                placeholder="Enter a time (HH:MM)"
                required
                />
            </div>
            <div class="eInput">
              <button id="eSubmit">Add Event</button>
            </div>
          </form>
        </td>
        <td class="calendarData">
          <div id="calendar"></div>
        </td>
        <td class="calendarData">
          <div id="dailyTasks"></div>
          <button id="markAsDone">Mark as Done</button>
        </td>
      </tr>
    </table>
    <script src="catFacts.js"></script>
  </body>
  <script src="script.js"></script>
</html>
